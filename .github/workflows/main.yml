name: Build ShortsAutoKit APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extract project
        run: |
          mkdir android-project
          unzip -q ShortsAutoKit_Android_Complete_Project.zip -d android-project

      - name: Generate Gradle wrapper
        run: |
          PROJECT_DIR=$(find android-project -name settings.gradle.kts -type f | head -n 1 | xargs dirname)
          cd "$PROJECT_DIR"
          gradle wrapper --gradle-version 8.10

      - name: Build APK
        run: |
          PROJECT_DIR=$(find android-project -name settings.gradle.kts -type f | head -n 1 | xargs dirname)
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShortsAutoKit-APK
          path: '**/build/outputs/apk/**/*.apk'

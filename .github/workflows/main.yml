name: Build ShortsAutoKit APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir android-project
          unzip -q ShortsAutoKit_Android_Complete_Project.zip -d android-project

      - name: Locate Gradle project
        run: |
          echo "Searching for Gradle project..."
          find android-project -name gradlew -type f

      - name: Build APK
        run: |
          GRADLEW=$(find android-project -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"

          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShortsAutoKit-APK
          path: '**/build/outputs/apk/**/*.apk'
